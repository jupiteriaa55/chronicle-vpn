[project]
name = "vpn-bot"
version = "0.1.0"
description = "Telegram bot that manages WireGuard VPN access with Stars / YooKassa / CryptoBot payments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13.0",
  "aiosqlite>=0.20.0",
  "qrcode[pil]>=7.4.2",
  "cryptography>=43.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "yookassa>=3.5.0",
  "uvicorn>=0.30.0",
  "fastapi>=0.115.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vpn_bot*"]
